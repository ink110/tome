<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1200px; height: 1800px; }
  body {
    background: #F5F1E8;
    color: #1A1A1A;
    font-family: "Songti SC", "Noto Serif CJK SC", "STSong", serif;
    position: relative;
    overflow: hidden;
  }
  .frame {
    position: absolute; inset: 64px;
    border: 1px solid rgba(26,26,26,0.25);
  }
  .kicker {
    position: absolute; top: 150px; left: 120px;
    font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif;
    font-size: 22px; letter-spacing: 0.42em; color: #8A8175;
  }
  .rule {
    position: absolute; top: 220px; left: 120px;
    width: 96px; height: 5px; background: {{ACCENT}};
  }
  .title {
    position: absolute; top: 300px; left: 112px; right: 112px;
    font-size: 118px; line-height: 1.22; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .subtitle {
    position: absolute; top: 900px; left: 120px; right: 180px;
    font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif;
    font-size: 34px; line-height: 1.7; color: #5B544B;
  }
  .bottom {
    position: absolute; bottom: 150px; left: 120px; right: 120px;
    display: flex; align-items: flex-end; justify-content: space-between;
    font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  .author { font-size: 28px; letter-spacing: 0.08em; color: #3A352F; }
  .year { font-size: 22px; letter-spacing: 0.3em; color: #9A9184; }
  .mark {
    position: absolute; right: 120px; top: 150px;
    font-family: "PingFang SC", sans-serif; font-size: 18px;
    letter-spacing: 0.3em; color: #9A9184;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="kicker">{{KICKER}}</div>
  <div class="rule"></div>
  <div class="mark">CASE / METHOD</div>
  <div class="title">{{TITLE}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="bottom">
    <div class="author">{{AUTHOR}}</div>
    <div class="year">{{YEAR}}</div>
  </div>
</body>
</html>
